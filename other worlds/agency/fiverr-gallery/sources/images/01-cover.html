<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=769">
<title>01 Gig Cover — Business Workflow Automation</title>
<style>
  :root {
    --ink: #0F172A;
    --ivory: #F8F5F0;
    --paper: #FFFFFF;
    --accent: #059669;
    --accent-dark: #047857;
    --muted: #64748B;
    --border: #E5E1D6;
    --line-warm: #D8D2C8;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 769px; margin: 0; background: var(--ivory); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
  .frame { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .pad { position: absolute; inset: 0 96px; }
  .eyebrow { position: absolute; top: 56px; left: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); }
  .headline { position: absolute; top: 104px; left: 0; width: 660px; font-family: var(--font-display); font-size: 44px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.14; color: var(--ink); }
  .sub { position: absolute; top: 262px; left: 0; width: 660px; font-size: 17px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); line-height: 1.5; }
  .rule { position: absolute; top: 302px; left: 0; width: 52px; height: 3px; background: var(--accent); border-radius: 2px; }
  .diagram { position: absolute; top: 360px; left: 0; width: 1088px; height: 180px; }
  .diagram svg { width: 100%; height: 100%; display: block; }
  .node { fill: var(--paper); stroke: var(--border); stroke-width: 1.4px; rx: 10px; ry: 10px; }
  .node-label { font-family: var(--font-body); font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: dominant-baseline; }
  .node-sub { font-family: var(--font-mono); font-size: 10.5px; fill: #94A3B8; text-anchor: middle; dominant-baseline: central; }
  .connector { stroke: var(--line-warm); stroke-width: 1.6px; fill: none; stroke-linecap: round; }
  .joint { fill: var(--accent); }
  .chips { position: absolute; top: 592px; left: 0; width: 1088px; height: 44px; display: flex; gap: 24px; }
  .chip { height: 44px; padding: 0 18px; background: var(--paper); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); flex-shrink: 0; }
  .footer { position: absolute; bottom: 48px; right: 0; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div class="frame">
  <div class="pad"></div>
  <div class="eyebrow">BUSINESS AUTOMATION &middot; n8n</div>
  <div class="headline">Business Workflow<br>Automation</div>
  <div class="sub">n8n Workflows &middot; Integrations &middot; Operations Systems</div>
  <div class="rule"></div>
  <div class="diagram">
    <svg viewBox="0 0 1088 180" xmlns="http://www.w3.org/2000/svg">
      <g class="connectors">
        <line class="connector" x1="200" y1="90" x2="222" y2="90" />
        <line class="connector" x1="422" y1="90" x2="444" y2="90" />
        <line class="connector" x1="644" y1="90" x2="666" y2="90" />
        <line class="connector" x1="866" y1="90" x2="888" y2="90" />
      </g>
      <g class="joints">
        <circle class="joint" cx="211" cy="90" r="4" />
        <circle class="joint" cx="433" cy="90" r="4" />
        <circle class="joint" cx="655" cy="90" r="4" />
        <circle class="joint" cx="877" cy="90" r="4" />
      </g>
      <rect class="node" x="0" y="61" width="200" height="58" />
      <rect class="node" x="222" y="61" width="200" height="58" />
      <rect class="node" x="444" y="61" width="200" height="58" />
      <rect class="node" x="666" y="61" width="200" height="58" />
      <rect class="node" x="888" y="61" width="200" height="58" />
      <text class="node-label" x="100" y="82" text-anchor="middle" dominant-baseline="central">Trigger</text>
      <text class="node-sub" x="100" y="100" text-anchor="middle">Webhook &middot; schedule &middot; manual start</text>
      <text class="node-label" x="322" y="82" text-anchor="middle" dominant-baseline="central">Process</text>
      <text class="node-sub" x="322" y="100" text-anchor="middle">Normalize &middot; validate &middot; consent log</text>
      <text class="node-label" x="544" y="82" text-anchor="middle" dominant-baseline="central">Integrate</text>
      <text class="node-sub" x="544" y="100" text-anchor="middle">Gmail &middot; HTTP &middot; Google Sheets</text>
      <text class="node-label" x="766" y="82" text-anchor="middle" dominant-baseline="central">Track</text>
      <text class="node-sub" x="766" y="100" text-anchor="middle">Case tracker &middot; escalation queue</text>
      <text class="node-label" x="988" y="82" text-anchor="middle" dominant-baseline="central">Output</text>
      <text class="node-sub" x="988" y="100" text-anchor="middle">Docs received &middot; case complete</text>
    </svg>
  </div>
  <div class="chips">
    <div class="chip">Workflows &amp; sub-workflows</div>
    <div class="chip">Integrations &amp; webhooks</div>
    <div class="chip">Conditional logic</div>
    <div class="chip">Dashboards &amp; tracking</div>
    <div class="chip">SaaS MVPs &middot; scoped separately</div>
  </div>
  <div class="footer">n8n &middot; business automation &middot; operations systems</div>
</div>
</body>
</html>
