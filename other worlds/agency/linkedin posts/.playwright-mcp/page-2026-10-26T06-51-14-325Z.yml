                    - generic [ref=f15e388]: Jim Fan is an Influencer
                  - paragraph [ref=f15e389]: NVIDIA Director of AI & Distinguished Scientist. Co-Lead of Project GR00T (Humanoid Robotics) & GEAR Lab. Stanford Ph.D. OpenAI's first intern. Solving Physical AGI, one motor at a time.
                  - generic [ref=f15e390]:
                    - generic [ref=f15e391]: 262,080 followers
                    - generic [ref=f15e392]:
