              - text: "AI Index 2025 cuts through all of it. Produced by the Institute for Human-Centered Artificial Intelligence, it’s one of the most respected and data-driven reports on the state of AI today. Over 400+ pages of concrete insights — from technical benchmarks and real-world adoption to policy shifts, economic impact, education, and public sentiment. 𝗧𝗵𝗲 2025 𝗲𝗱𝗶𝘁𝗶𝗼𝗻 𝗱𝗿𝗼𝗽𝗽𝗲𝗱 𝗹𝗮𝘀𝘁 𝘄𝗲𝗲𝗸. 𝗛𝗲𝗿𝗲 𝗮𝗿𝗲 12 𝗸𝗲𝘆 𝘁𝗮𝗸𝗲𝗮𝘄𝗮𝘆𝘀: 1. 𝗕𝗲𝗻𝗰𝗵𝗺𝗮𝗿𝗸𝘀 𝗮𝗿𝗲 𝗯𝗲𝗶𝗻𝗴 𝗰𝗿𝘂𝘀𝗵𝗲𝗱. ➝ AI performance on complex reasoning and programming tasks surged by up to 67 percentage points in just one year. 2. 𝗔𝗜 𝗶𝘀 𝗻𝗼 𝗹𝗼𝗻𝗴𝗲𝗿 𝘀𝘁𝘂𝗰𝗸 𝗶𝗻 𝘁𝗵𝗲 𝗹𝗮𝗯. ➝ 223 FDA-approved AI medical devices. Over 150,000 autonomous rides weekly from Waymo. This is mainstream adoption. 3. 𝗕𝘂𝘀𝗶𝗻𝗲𝘀𝘀 𝗶𝘀 𝗴𝗼𝗶𝗻𝗴 𝗮𝗹𝗹-𝗶𝗻. ➝ $109B in U.S. private AI investment. 78% of organizations using AI. Productivity gains are no longer theoretical. 4. 𝗧𝗵𝗲 𝗨.𝗦. 𝗹𝗲𝗮𝗱𝘀 𝗶𝗻 𝗾𝘂𝗮𝗻𝘁𝗶𝘁𝘆—𝗖𝗵𝗶𝗻𝗮’𝘀 𝗰𝗮𝘁𝗰𝗵𝗶𝗻𝗴 𝘂𝗽 𝗼𝗻 𝗾𝘂𝗮𝗹𝗶𝘁𝘆. ➝ Chinese models now rival U.S. models on MMLU, HumanEval, and more. Global AI is becoming a multi-polar game. 5. 𝗥𝗲𝘀𝗽𝗼𝗻𝘀𝗶𝗯𝗹𝗲 𝗔𝗜 𝗶𝘀 𝗹𝗮𝗴𝗴𝗶𝗻𝗴 𝗯𝗲𝗵𝗶𝗻𝗱 𝗶𝗻𝗻𝗼𝘃𝗮𝘁𝗶𝗼𝗻. ➝ Incidents are rising, but standardized RAI benchmarks and audits are still rare. Governments are stepping in faster than vendors. 6. 𝗚𝗹𝗼𝗯𝗮𝗹 𝗼𝗽𝘁𝗶𝗺𝗶𝘀𝗺 𝗶𝘀 𝗿𝗶𝘀𝗶𝗻𝗴—𝗯𝘂𝘁 𝗻𝗼𝘁 𝗲𝘃𝗲𝗻𝗹𝘆. ➝ 83% of people in China are optimistic about AI. In the U.S., that number is just 39%. 7. 𝗔𝗜 𝗶𝘀 𝗴𝗲𝘁𝘁𝗶𝗻𝗴 𝗰𝗵𝗲𝗮𝗽𝗲𝗿, 𝘀𝗺𝗮𝗹𝗹𝗲𝗿, 𝗮𝗻𝗱 𝗳𝗮𝘀𝘁𝗲𝗿. ➝ The cost of GPT-3.5-level inference dropped 280x in two years. Open-weight models are nearly matching closed ones. 8. 𝗚𝗼𝘃𝗲𝗿𝗻𝗺𝗲𝗻𝘁𝘀 𝗮𝗿𝗲 𝗿𝗲𝗴𝘂𝗹𝗮𝘁𝗶𝗻𝗴 𝗮𝗻𝗱 𝗶𝗻𝘃𝗲𝘀𝘁𝗶𝗻𝗴. ➝ From Canada’s $2.4B to Saudi Arabia’s $100B push—states aren’t watching from the sidelines anymore. 9. 𝗘𝗱𝘂𝗰𝗮𝘁𝗶𝗼𝗻 𝗶𝘀 𝗲𝘅𝗽𝗮𝗻𝗱𝗶𝗻𝗴—𝗯𝘂𝘁 𝗿𝗲𝗮𝗱𝗶𝗻𝗲𝘀𝘀 𝗹𝗮𝗴𝘀. ➝ Access is improving, but infrastructure gaps and lack of teacher training still limit global reach. 10. 𝗜𝗻𝗱𝘂𝘀𝘁𝗿𝘆 𝗶𝘀 𝗱𝗼𝗺𝗶𝗻𝗮𝘁𝗶𝗻𝗴 𝗺𝗼𝗱𝗲𝗹 𝗱𝗲𝘃𝗲𝗹𝗼𝗽𝗺𝗲𝗻𝘁. ➝ 90% of top AI models now come from companies—not academia. The gap between top players is shrinking fast. 11. 𝗔𝗜 𝗶𝘀 𝘀𝗵𝗮𝗽𝗶𝗻𝗴 𝘀𝗰𝗶𝗲𝗻𝗰𝗲. ➝ AI-driven breakthroughs in physics, chemistry, and biology are earning Nobel Prizes and Turing Awards. 12. 𝗖𝗼𝗺𝗽𝗹𝗲𝘅 𝗿𝗲𝗮𝘀𝗼𝗻𝗶𝗻𝗴 𝗿𝗲𝗺𝗮𝗶𝗻𝘀 𝘁𝗵𝗲 𝗰𝗲𝗶𝗹𝗶𝗻𝗴. ➝ Despite all the progress, models still struggle with logic-heavy tasks. Precision is still a challenge. You can download the full report FREE here:"
