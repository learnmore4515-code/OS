              - button "Open menu" [ref=f15e200] [cursor=pointer]
            - paragraph [ref=f15e202]: "Been perfecting this small team AI methodology, and it’s incredibly effective. Get 4-8 people together, at least one technical and at least one subject matter expert, and sprint together with paid AI tools (free tools are fun for experiments, not for business). Start with a multi-hour shareout (with AI recording and transcribing!) of the SME sharing the latest in their field, the work the company is doing, the blockers the company has, what you would share if you were onboarding someone new and wanted them to succeed. Then have the dev/SWE/SA/DS do the same. Be sure to include what tools and resources are available, what is actually used in your company’s stack, what’s working, and what’s not. Then run two deep research queries: one on your specific company, one on AI’s impact on your narrow industry. Then brainstorm how to use AI to transform your business (have AI record and transcribe this too! Otter is easy, but there are others). THEN take both deep research outputs and single-person transcriptions, load it as context. Then prompt the AI to brainstorm potential AI ideas, giving the third transcript as an example. In your prompt… Ask for 200 ideas. Ask AI to score and rank the ideas on criteria you care about (potential revenue? Speed to deploy? People required?). Make sure the top 5 are wide in their support (ie not just 5 ideas to improve calendar management). Ask AI to give a mini execution plan for the top 5. Ask for what you might be missing. Ask for ways to make the ideas 5x better. Ask for revolutionary ways to execute the 5 so that they score higher on your criteria. Try and be in person if possible. It's extra magic. We are seeing cutbacks from cost pressures, uncertain economic conditions, and the hope of AI. I am not (yet?) a proponent for 4-day work weeks, but I am a big proponent of smaller teams. This is one way to get ahead. ♻️ Save and share this post with others who could use an AI edge."
