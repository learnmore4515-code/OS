              - text: "Just a year ago it was all about GenAI. Today the spotlight is on Agentic AI. What is driving the shift? 𝗗𝗲𝗳𝗶𝗻𝗶𝘁𝗶𝗼𝗻 - GenAI: Models that create or transform content in response to prompts. - Agentic AI: Systems that can pursue goals, plan tasks, and take action with minimal human input. GenAI helps generate ideas; Agentic AI takes action and gets things done. 𝗚𝗲𝗻𝗔𝗜 𝘀𝘁𝗿𝗲𝗻𝗴𝘁𝗵𝘀 - Rapid content & pattern creation - Natural‑language front ends for analytics Finance examples • Auto‑drafted research and client letters • Multilingual regulatory summaries • Synthetic stress‑test narratives 𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗔𝗜 𝘀𝘁𝗿𝗲𝗻𝗴𝘁𝗵𝘀 • Real‑time decisioning under uncertainty • Multi‑skill chaining (retrieve → reason → act) • Continuous learning from outcomes Finance examples • Millisecond fraud-blocking on millions of card transactions • Dynamic risk-rule tuning based on issuer feedback • Automated receivables follow-up and payment posting • Autonomous treasury operations: FX hedging and overnight liquidity management 𝗪𝗵𝘆 𝘁𝗵𝗲 𝘀𝗵𝗶𝗳𝘁 Moving from GenAI to Agentic AI fundamentally changes how financial services deliver value: • Real-time revenue protection: agentic systems can reroute or block high-risk payments instantly, slashing fraud losses and chargebacks. • Seamless customer journeys: fully automated KYC and onboarding flows. • Dynamic liquidity management: treasury bots rebalance cash, execute FX hedges, and optimize funding costs overnight. • End-to-end payment orchestration from choosing the most cost-effective cross-border rail to retrying failed pay-outs. • Regulatory agility: continuous-monitoring agents track rule changes, update compliance workflows, and generate audit trails without manual intervention. 𝗪𝗵𝗮𝘁’𝘀 𝗻𝗲𝘅𝘁 • Conversational banking agents: go beyond answering questions - initiate transfers, set up recurring payments, and negotiate loan terms. • Embedded Finance at scale: agents orchestrate lending, insurance, and FX in real time within non-financial apps. • On-demand cross-border settlement: smart agents choose between CBDCs, stablecoins, or traditional rails to settle payments instantly at the lowest cost. • Predictive risk & credit scoring: continuously update merchant and counterparty scores as new data streams in. • Auto-remediating systems: agents detect and fix platform issues in real time - no human ops required. • Automated regtech: agentic workflows handle licensing, screening, reporting, and audits - cutting compliance time from weeks to hours. • AI treasury market making: bots quote and underwrite liquidity in real time, adjusting spreads dynamically to market shifts. Opinions: my own 𝐒𝐮𝐛𝐬𝐜𝐫𝐢𝐛𝐞 𝐭𝐨 𝐦𝐲 𝐧𝐞𝐰𝐬𝐥𝐞𝐭𝐭𝐞𝐫:"
