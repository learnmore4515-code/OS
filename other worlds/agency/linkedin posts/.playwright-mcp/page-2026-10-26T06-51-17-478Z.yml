              - paragraph [ref=f17e295]: "This morning I ran a loop in Cambridge that put me in reflective mood... How do you shape your career? It's a question I've been asked a lot, even more since announcing I would step down from Google. Some asking were just starting out in the world of work, like my wonderful sons and their friends. Some were colleagues wondering about promotion, moving geography or function. Sometimes it was people established in leadership roles asking - what next? Through nearly 40 years of working life, I’ve had hundreds of similar conversations. Many helped me reach my own recent decision. Here's what I learned, and passed on. The same, simple ideas seemed universally helpful: 1 - If you do one thing only: ask for help. From people a step or two ahead of you, maybe they’re in a role you covet, or do things in a way you admire. Be bold. Almost everyone remembers being where you are, most of them are kind enough to help. Don't ask for a job, ask for advice; how they see you; is there anyone they know who could help. A chat yields perspective; many lead you to someone new and to opportunities. People are generous and even if they’re too busy to talk, they won't be offended by you asking. Ideally have coffee* in person. In my experience this is the most effective approach BY FAR. It's how I landed at Google, how I got involved as a Trustee at more than one charity and as a Non Exec Director for a public company. And it's how I decided to take a jump into my ‘gap year’ so belatedly… 2 - Make time to do this. Every week. If you are already in a role you won’t have the time. Because you aren't prioritising yourself. So make growing your career a project, like you do for other important initiatives. Project Matt. Or Karina. Or Molly. Block 2-3 hours a week out. Use the time to find and contact people, to have those chats, and follow up. I'm serious. Not everyone you mail will respond, not everyone who responds has time, not everyone who chats will change your life. But the more you put in the more you will get out. Sometimes I suggest to people who are struggling to prioritise themselves to email me a brief weekly progress report on Project Them, like they would with an important work project - accountability helps. Don't drop the ball. This is an important work project! 3 - Of course, do the other things. Apply for roles, talk to recruiters, go to events. Read helpful books (I’ll share a few that helped me soon). Today's job market often requires lengthy, bespoke online applications. They may be for roles that are fictional placeholders, or will be filled by internal candidates. You learn nothing from the process and make no human contact. So don't only do step 3, you might luck out but you won’t learn and grow anything like as much in the process. I would like to thank so many people, too numerous to mention, for the coffee* chats, walk, talks and notes that helped me develop and grow over the years. *Other beverages are available."
