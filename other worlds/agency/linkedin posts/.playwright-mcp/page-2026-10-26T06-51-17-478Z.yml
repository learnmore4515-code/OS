              - paragraph [ref=f17e333]:
                - text: "🚀 From Free to Elite: Cybersecurity Certification Roadmap (L1 to CISO) Whether you're starting or aiming for the top, you don’t need to spend big at the beginning—but you do need a smart path. 📍Here’s a practical roadmap from SOC Analyst (L1) to CISO/CTO, starting with free certifications and scaling to elite credentials: --- 🔰 L1 – SOC Analyst / Security Support (0–2 yrs) ✅ Free Certs: • Google Cybersecurity (Coursera – via financial aid) • Cisco Intro to Cybersecurity (NetAcad) • Microsoft SC-900 (Free via MS events) • Fortinet NSE 1–3 💡 Optional Paid: • CompTIA Security+ • Cisco CyberOps Associate 🛠️ Tools: Splunk, QRadar, Chronicle, Wireshark, VirusTotal --- 🧠 L2 – Security Analyst / Threat Hunter / IR (2–4 yrs) ✅ Free/Low-Cost: • IBM Cybersecurity Analyst (Coursera – aid) • MITRE ATT&CK Defender (MAD) • Microsoft SC-200 (Free via Reactor) • TryHackMe Blue Team Path (₹900/mo) 💡 Paid: • CompTIA CySA+ • CEH (EC-Council) • Blue Team Level 1 (BTLO) 🛠️ Skills: Defender, EDRs, Sigma, MITRE Navigator --- 🛡️ L3 – Sr Analyst / Engineer / SOC Lead (4–7 yrs) ✅ Low-Cost: • Splunk Admin/Use Case (SplunkWork+) • Elastic Certified Analyst • MITRE CTI 💡 Paid Elite: • GIAC GCIH/GCIA • SC-100 (Microsoft Architect) • BTLO Level 2 🛠️ Skills: RCA, SOAR, Threat Detection Engineering --- ⚙️ Security Manager / GRC / Architect (7–10 yrs) ✅ Free/GRC Certs: • ISO 27001 LA/LI (free/discounted) • Heimdal Security Fundamentals • Harvard Cybersecurity (Free Audit) 💡 Paid: • CISM / CISA (ISACA) • CCSP (Cloud Security – ISC²) 🛠️ Focus: NIST, ISO, Risk, Compliance 👨💼 CISO / CTO (10+ yrs) ✅ Free Learning: • Cyber Leadership (LinkedIn, Harvard Open) • Webinars (SANS, EC-Council, ISC²) 💡 Top-Tier Certs: • CISSP • C-CISO • Cloud Security Expert / Executive MBA 🛠️ Mastery: Budgeting, Board Comms, Legal Risk, ROI --- ✅ Start Free – Google, Cisco, MS, IBM ✅ Grow Practical – TryHackMe, MAD, BTLO, Splunk ✅ Go Elite – CISSP, CISM, GCIH, CCSP 📍Certs open doors. Skills keep them open. Leadership takes you further. 👇 Comment where you're in the journey, I’ll share free resources!"
