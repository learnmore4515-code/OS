            - generic [ref=f17e389]:
              - paragraph [ref=f17e390]: "Amit dedicated 7 years to his company. He started at ₹12 LPA and, after years of hard work, reached ₹20 LPA. One day, he casually asked a new hire about their salary—₹30 LPA. Shock. Betrayal. He had trained others, handled crises, and never dropped the ball. Yet, a newcomer with less experience made ₹10 lakh more. His manager’s response? \"We value you, but external hires are paid market rates.\" Reality check: New hires get market pay. Loyal employees get small increments. Appreciation ≠ Compensation. Amit tested the market and got a 40% hike in 90 days. Suddenly, his company wanted to match it—but he had already moved on. Lesson? Loyalty should be a two-way street. Know your worth. Keep an eye on market trends. Negotiate what you deserve. Because staying too long without evaluating your worth is the costliest mistake."
