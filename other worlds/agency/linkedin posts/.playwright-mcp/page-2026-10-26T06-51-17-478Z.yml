              - paragraph [ref=f17e135]:
                - text: "The worst mistake employers make? Waiting for a resignation to offer a pay rise. By that point it's too late. The damage is already done. As uncomfortable as salary conversations can be (they shouldn't!). You need to advocate for yourself. Your employer won't give you a raise if you don't ask. Here's How to Have a Salary Conversations Like a Pro: 1️⃣ Set Clear Goals with Your Manager ↳ Define what success & progression looks like. ↳ Set KPI's that justify a pay rise later. 2️⃣ Have Regular Conversations About Growth ↳ Don’t wait for the annual review. Check in quarterly. ↳ Ask: “What can I do to be in the best position for a promotion?” Work on a plan together to upskill, get more responsibility & add more value. 3️⃣ Document Your Success ↳ Track wins, metrics & business impact. ↳ Use those numbers in your performance reviews. Instead of “I’ve worked hard” say: “I led [Project] which increased [Metric] by X% and saved Y hours.” 4️⃣ Promote Your Work (Without Bragging) ↳ Don’t assume people know what you've done. ↳ Present updates, share results, speak up in meetings. 5️⃣ Make the Ask (So It Feels Collaborative, Not Demanding) ↳ Timing matters. Make it an agreed time or in line with company reviews. Try: “Based on my contributions in [Project], I’d love to discuss salary progression. What would it take for me to reach [target salary]?” 6️⃣ Leverage the Market (If Necessary) ↳ If nothing is happening internally, go outside. ↳ Get an offer on the table to give you leverage. If your company won’t pay you what you deserve, another one will. Retention is cheaper than recruitment. ♻️ Repost to help people advocate for themselves. 👋🏼 Follow"
