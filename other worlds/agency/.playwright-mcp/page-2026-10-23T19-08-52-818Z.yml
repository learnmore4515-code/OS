              - heading "FAQ" [level=2] [ref=f55e1653]
              - generic [ref=f55e1654]:
                - article [ref=f55e1655]:
                  - paragraph [ref=f55e1658] [cursor=pointer]: What platforms and tools do you specialize in?
                  - paragraph [ref=f55e1663]: I specialize in Make.com and n8n, with deep experience integrating tools like Google Sheets, Airtable, CRMs, Slack, Trello, Stripe, PayPal, Calendly, Retell AI, Vapi AI, LiveKit, and custom APIs via webhooks.
                - article [ref=f55e1664]:
                  - paragraph [ref=f55e1667] [cursor=pointer]: Can you fix or optimize my existing automation?
                  - paragraph [ref=f55e1672]: Yes. I can debug broken workflows, optimize slow or error-prone automations, clean up logic, reduce operation costs, and improve reliability without rebuilding everything from scratch unless necessary.
                - article [ref=f55e1673]:
                  - paragraph [ref=f55e1676] [cursor=pointer]: Can my AI agent handle appointment booking and send follow-up messages automatically?
                  - paragraph [ref=f55e1681]: Yes! Your AI voice agent or GHL chatbot can book appointments, send reminders, and trigger automated follow-ups using Zapier AI or n8n while syncing all data and notes to your CRM.
                - article [ref=f55e1682]:
                  - paragraph [ref=f55e1685] [cursor=pointer]: Do you provide Make.com and n8n automation for AI-powered workflows?
                  - paragraph [ref=f55e1690]: Definitely. I can build custom Make.com and n8n workflows that connect Vapi AI, Retell AI, and GoHighLevel CRM to update records, send notifications, and manage multi-channel automations without manual effort
                - article [ref=f55e1691]:
                  - paragraph [ref=f55e1694] [cursor=pointer]: Can you integrate Zapier AI with my voice agent and chatbot systems?
                  - paragraph [ref=f55e1699]: Yes. I will connect your AI voice agent, Retell AI, or GHL chatbot with Zapier AI to trigger tasks like lead updates, email follow-ups, SMS alerts, and cross-platform data sync automatically.
                - article [ref=f55e1700]:
                  - paragraph [ref=f55e1703] [cursor=pointer]: Can you set up multiple AI agents for advanced automation?
                  - paragraph [ref=f55e1708]: Absolutely! I can create an AI Agent Squad using Vapi AI, Retell AI, and GoHighLevel chatbots where voice and chat agents collaborate to handle calls, messages, and lead management seamlessly.
                - article [ref=f55e1709]:
                  - paragraph [ref=f55e1712] [cursor=pointer]: Will you provide ongoing support for my AI automation setup?
                  - paragraph [ref=f55e1717]: Yes! I offer custom scripts, workflow optimization, and post-setup support for GoHighLevel CRM automation, Zapier AI, n8n, Make.com, Vapi AI, and Retell AI, ensuring your system runs smoothly 24/7.
                - article [ref=f55e1718]:
                  - paragraph [ref=f55e1721] [cursor=pointer]: Can you migrate my Zapier or Make automations to n8n?
                  - paragraph [ref=f55e1726]: Yes. I handle Zapier or Make to n8n migrations, ensuring all logic, triggers, and edge cases are preserved while improving flexibility and lowering long-term costs.
                - article [ref=f55e1727]:
                  - paragraph [ref=f55e1730] [cursor=pointer]: Do you provide documentation or training?
                  - paragraph [ref=f55e1735]: Yes. I can provide clear documentation, walkthroughs, and personalized n8n tutoring so you understand how your automation works and can manage it confidently.
