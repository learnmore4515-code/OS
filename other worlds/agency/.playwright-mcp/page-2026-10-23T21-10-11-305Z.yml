    - strong [ref=f3e7]: WB-08 — Document Chasing Escalation
    - text: ", a multi-step workflow with sub-workflow triggers, conditional routing by escalation day, and integrations across Gmail, Google Sheets and HTTP webhooks. Every step below is taken from the real workflow definition (synthetic demo data; no live credentials)."
