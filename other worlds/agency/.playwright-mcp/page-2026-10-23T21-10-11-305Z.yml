      - row [ref=f3e15]:
        - cell "1" [ref=f3e16]
        - cell "Document Chasing Trigger" [ref=f3e17]
        - cell "Entry from Chain 4 ops hub when verification is partial/invalid (Day 0). Also a daily 09:00 schedule trigger scans for overdue chases." [ref=f3e18]
      - row [ref=f3e19]:
        - cell "2" [ref=f3e20]
        - cell "Normalize New Chase" [ref=f3e21]
        - cell "Set node normalises client details, missing fields, chase start date, escalation stage, consent and insurer / adjuster contacts." [ref=f3e22]
      - row [ref=f3e23]:
        - cell "3" [ref=f3e24]
        - cell "Gmail — Day 0 Secure Upload Link" [ref=f3e25]
        - cell "Sends the client a personalised, tokenised upload link listing exactly which documents are missing, why each is needed and the deadline. ODPC consent logged at first touch." [ref=f3e26]
      - row [ref=f3e27]:
        - cell "4" [ref=f3e28]
        - cell "Notify Insurer / Loss Adjuster" [ref=f3e29]
        - cell "HTTP POST webhook notifies insurer and loss adjuster (multi-party alignment — all parties see shared milestone status)." [ref=f3e30]
      - row [ref=f3e31]:
        - cell "5" [ref=f3e32]
        - cell "Log ODPC Consent + Update Tracker" [ref=f3e33]
        - cell "Logs consent channel and date; appends a chase record to the Google Sheets document tracker." [ref=f3e34]
      - row [ref=f3e35]:
        - cell "6" [ref=f3e36]
        - cell "Daily Scan · Filter Pending" [ref=f3e37]
        - cell "Reads the tracker; filters chases that are pending and not yet verified." [ref=f3e38]
      - row [ref=f3e39]:
        - cell "7" [ref=f3e40]
        - cell "Switch — Escalation Day" [ref=f3e41]
        - 'cell "Conditional router by days since chase: +2 friendly nudge, +4 formal reminder, +7 phone-call task, renewals at 60/30/7/3 days, nothing due otherwise." [ref=f3e42]'
      - row [ref=f3e43]:
        - cell "8" [ref=f3e44]
        - cell "Phone Task + Exception Queue" [ref=f3e45]
        - cell "Day +7 creates a broker phone-call task; >7 days with no response creates an exception queue entry (severity high, 24h SLA, recommended action)." [ref=f3e46]
      - row [ref=f3e47]:
        - cell "9" [ref=f3e48]
        - cell "Update Tracker Stage" [ref=f3e49]
        - cell "Writes escalation stage, last contact channel and status back to the tracker sheet; errors are logged rather than dropped." [ref=f3e50]
