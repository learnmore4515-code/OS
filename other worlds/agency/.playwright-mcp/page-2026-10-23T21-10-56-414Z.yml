- generic [ref=f4e2]:
  - generic [ref=f4e4]: Case Study · Page 1 of 3
  - heading "The Operational Challenge" [level=1] [ref=f4e5]
  - paragraph [ref=f4e7]: "Insurance brokers in Kenya run on paperwork — KYC documents, claim forms and onboarding paperwork must be collected from clients before a policy can be bound or a claim paid. Today that chasing is manual: WhatsApp threads, SMS, email and spreadsheets held in separate places, with no single source of truth."
  - paragraph [ref=f4e8]:
    - strong [ref=f4e9]: The workflow’s purpose.
    - text: "Document chasing automation: a broker opens a case, the system sends the client a secure, tokenised upload link on their preferred channel, tracks every response, and flags anything still open after seven days to an exception queue for senior review. The broker decides; the system nudges, tracks and escalates."
  - generic [ref=f4e10]: Why manual chasing fails
  - paragraph [ref=f4e11]: "These failure modes come from discovery conversations with brokers (Deliverable C of the project), not assumptions:"
  - list [ref=f4e12]:
    - listitem [ref=f4e13]: ▸ Understanding Clients don’t understand what is needed — requests are incomplete or confusing.
    - listitem [ref=f4e14]: ▸ Submission Documents are difficult to submit — no mobile-friendly upload path, no app installation acceptable.
    - listitem [ref=f4e15]: ▸ Trust Clients distrust upload links and prefer WhatsApp or email as an alternative.
    - listitem [ref=f4e16]: ▸ Tracking Brokers lose track of who owes what; follow-ups get forgotten across disconnected channels.
    - listitem [ref=f4e17]: ▸ Parties Client, broker, insurer and loss adjuster all share responsibility, with no shared status view.
    - listitem [ref=f4e18]: ▸ Escalation Cases overdue more than 7 days have no structured path to a senior broker.
  - generic [ref=f4e19]: No revenue figures, conversion rates or client counts are claimed here — this is a capability demonstration built on the project’s own research, not a delivered production deployment.
  - generic [ref=f4e20]: Scope note. Document chasing only — payment reconciliation, automated underwriting and policy issuance are explicitly out of scope (Deliverable F).
  - generic [ref=f4e21]: Automation case study · Document Chasing Escalation · synthetic demo data · no live credentials shown