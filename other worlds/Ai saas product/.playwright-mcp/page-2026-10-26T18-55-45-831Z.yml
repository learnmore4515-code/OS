            - list [ref=f2e28]:
              - listitem [ref=f2e29]: Claims slow down at handoffs between teams — FNOL, document review, triage, settlement
              - listitem [ref=f2e30]: Missing documents and incomplete information cause repeated follow-ups
              - listitem [ref=f2e31]: Manual data entry creates errors and slows settlement
              - listitem [ref=f2e32]: Customers wait weeks for claim outcomes they expect in days
