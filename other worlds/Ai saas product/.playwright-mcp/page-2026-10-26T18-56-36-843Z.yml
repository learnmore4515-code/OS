            - listitem [ref=f5e56]: Improved customer satisfaction
      - generic [ref=f5e57]:
        - heading "Frequently asked questions" [level=3] [ref=f5e58]
        - generic [ref=f5e59]:
          - generic [ref=f5e60]:
            - paragraph [ref=f5e61]: How long does claims automation take to implement?
            - paragraph [ref=f5e62]: Most insurance teams see a working automation in 1-2 weeks. We start with a diagnosis to identify the highest-impact manual steps, then build and hand over.
          - generic [ref=f5e63]:
            - paragraph [ref=f5e64]: Which claims types work best for automation?
            - paragraph [ref=f5e65]: Motor, property, and SME claims with straightforward documentation are the best candidates. Complex multi-party claims still need human adjuster oversight — we route those automatically.
          - generic [ref=f5e66]:
            - paragraph [ref=f5e67]: Do we need to replace our claims system?
            - paragraph [ref=f5e68]: No. Automation integrates with your existing claims management system and document storage. We connect to what you already use.
          - generic [ref=f5e69]:
            - paragraph [ref=f5e70]: Is customer data secure?
            - paragraph [ref=f5e71]: Yes. All document processing and data handling follows Kenyan data protection requirements. Customer data stays within your controlled environment.
