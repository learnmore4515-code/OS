      - heading "Claims Processing Automation for Kenyan Insurers" [level=1] [ref=f5e23]
      - paragraph [ref=f5e24]: End-to-end claims automation from FNOL to settlement. We help Kenyan insurance teams automate document ingestion, AI extraction, triage, and auto-approval — cutting claims processing from weeks to hours.
      - generic [ref=f5e25]:
        - generic [ref=f5e26]:
          - heading "The problem" [level=3] [ref=f5e27]
          - list [ref=f5e28]:
            - listitem [ref=f5e29]: Claims slow down at handoffs between teams — FNOL, document review, triage, settlement
            - listitem [ref=f5e30]: Missing documents and incomplete information cause repeated follow-ups
            - listitem [ref=f5e31]: Manual data entry creates errors and slows settlement
            - listitem [ref=f5e32]: Customers wait weeks for claim outcomes they expect in days
        - generic [ref=f5e33]:
          - heading "What we automate" [level=3] [ref=f5e34]
          - list [ref=f5e35]:
            - listitem [ref=f5e36]: FNOL (First Notice of Loss) intake
            - listitem [ref=f5e37]: Document ingestion and AI extraction
            - listitem [ref=f5e38]: Claims triage and routing
            - listitem [ref=f5e39]: Auto-approval for low-complexity claims
            - listitem [ref=f5e40]: Adjuster dashboard and case management
      - generic [ref=f5e41]:
        - generic [ref=f5e42]:
          - heading "Step-by-step workflow" [level=3] [ref=f5e43]
          - list [ref=f5e44]:
            - listitem [ref=f5e45]: Claim reported via FNOL — details captured automatically
            - listitem [ref=f5e46]: Documents uploaded and extracted with AI
            - listitem [ref=f5e47]: Claim triaged and routed to the right adjuster
            - listitem [ref=f5e48]: Low-complexity claims auto-approved for settlement
            - listitem [ref=f5e49]: Adjuster manages complex claims end-to-end
        - generic [ref=f5e50]:
