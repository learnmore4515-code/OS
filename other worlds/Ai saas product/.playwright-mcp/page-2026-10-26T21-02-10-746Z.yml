        - heading "Claims Processing Automation for Kenyan Insurers" [level=1] [ref=f2e22]
        - paragraph [ref=f2e23]: End-to-end claims automation from FNOL to settlement. Leo Pisha helps Kenyan insurance teams automate document ingestion, AI extraction, triage, and auto-approval — cutting claims processing from weeks to hours.
        - generic [ref=f2e24]:
          - generic [ref=f2e25]:
            - heading "The problem" [level=3] [ref=f2e26]
            - list [ref=f2e27]:
              - listitem [ref=f2e28]: Claims slow down at handoffs between teams — FNOL, document review, triage, settlement
              - listitem [ref=f2e29]: Missing documents and incomplete information cause repeated follow-ups
              - listitem [ref=f2e30]: Manual data entry creates errors and slows settlement
              - listitem [ref=f2e31]: Customers wait weeks for claim outcomes they expect in days
          - generic [ref=f2e32]:
            - heading "What we automate" [level=3] [ref=f2e33]
            - list [ref=f2e34]:
