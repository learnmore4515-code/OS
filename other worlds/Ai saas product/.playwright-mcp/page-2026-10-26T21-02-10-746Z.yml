        - generic [ref=f2e56]:
          - heading "Frequently asked questions" [level=3] [ref=f2e57]
          - generic [ref=f2e58]:
            - generic [ref=f2e59]:
              - paragraph [ref=f2e60]: How long does claims automation take to implement?
              - paragraph [ref=f2e61]: Most insurance teams see a working automation in 1-2 weeks. We start with a diagnosis to identify the highest-impact manual steps, then build and hand over.
            - generic [ref=f2e62]:
              - paragraph [ref=f2e63]: Which claims types work best for automation?
              - paragraph [ref=f2e64]: Motor, property, and SME claims with straightforward documentation are the best candidates. Complex multi-party claims still need human adjuster oversight — we route those automatically.
            - generic [ref=f2e65]:
              - paragraph [ref=f2e66]: Do we need to replace our claims system?
              - paragraph [ref=f2e67]: No. Automation integrates with your existing claims management system and document storage. We connect to what you already use.
            - generic [ref=f2e68]:
              - paragraph [ref=f2e69]: Is customer data secure?
              - paragraph [ref=f2e70]: Yes. All document processing and data handling follows Kenyan data protection requirements. Customer data stays within your controlled environment.
