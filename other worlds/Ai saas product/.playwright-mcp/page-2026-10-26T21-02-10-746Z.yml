              - listitem [ref=f2e36]: Document ingestion and AI extraction
              - listitem [ref=f2e37]: Claims triage and routing
              - listitem [ref=f2e38]: Auto-approval for low-complexity claims
              - listitem [ref=f2e39]: Adjuster dashboard and case management
        - generic [ref=f2e40]:
