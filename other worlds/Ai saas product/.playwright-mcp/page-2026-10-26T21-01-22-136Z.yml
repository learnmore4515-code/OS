      - generic [ref=f1e56]:
        - heading "Frequently asked questions" [level=3] [ref=f1e57]
        - generic [ref=f1e58]:
          - generic [ref=f1e59]:
            - paragraph [ref=f1e60]: How long does claims automation take to implement?
            - paragraph [ref=f1e61]: Most insurance teams see a working automation in 1-2 weeks. We start with a diagnosis to identify the highest-impact manual steps, then build and hand over.
          - generic [ref=f1e62]:
            - paragraph [ref=f1e63]: Which claims types work best for automation?
            - paragraph [ref=f1e64]: Motor, property, and SME claims with straightforward documentation are the best candidates. Complex multi-party claims still need human adjuster oversight — we route those automatically.
          - generic [ref=f1e65]:
            - paragraph [ref=f1e66]: Do we need to replace our claims system?
            - paragraph [ref=f1e67]: No. Automation integrates with your existing claims management system and document storage. We connect to what you already use.
          - generic [ref=f1e68]:
            - paragraph [ref=f1e69]: Is customer data secure?
            - paragraph [ref=f1e70]: Yes. All document processing and data handling follows Kenyan data protection requirements. Customer data stays within your controlled environment.
