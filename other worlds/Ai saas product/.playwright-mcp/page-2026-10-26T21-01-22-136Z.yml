      - heading "Claims Processing Automation for Kenyan Insurers" [level=1] [ref=f1e22]
      - paragraph [ref=f1e23]: End-to-end claims automation from FNOL to settlement. Leo Pisha helps Kenyan insurance teams automate document ingestion, AI extraction, triage, and auto-approval — cutting claims processing from weeks to hours.
      - generic [ref=f1e24]:
        - generic [ref=f1e25]:
          - heading "The problem" [level=3] [ref=f1e26]
          - list [ref=f1e27]:
            - listitem [ref=f1e28]: Claims slow down at handoffs between teams — FNOL, document review, triage, settlement
            - listitem [ref=f1e29]: Missing documents and incomplete information cause repeated follow-ups
            - listitem [ref=f1e30]: Manual data entry creates errors and slows settlement
            - listitem [ref=f1e31]: Customers wait weeks for claim outcomes they expect in days
        - generic [ref=f1e32]:
          - heading "What we automate" [level=3] [ref=f1e33]
          - list [ref=f1e34]:
            - listitem [ref=f1e35]: FNOL (First Notice of Loss) intake
            - listitem [ref=f1e36]: Document ingestion and AI extraction
            - listitem [ref=f1e37]: Claims triage and routing
            - listitem [ref=f1e38]: Auto-approval for low-complexity claims
            - listitem [ref=f1e39]: Adjuster dashboard and case management
      - generic [ref=f1e40]:
        - generic [ref=f1e41]:
          - heading "Step-by-step workflow" [level=3] [ref=f1e42]
          - list [ref=f1e43]:
            - listitem [ref=f1e44]: Claim reported via FNOL — details captured automatically
            - listitem [ref=f1e45]: Documents uploaded and extracted with AI
            - listitem [ref=f1e46]: Claim triaged and routed to the right adjuster
            - listitem [ref=f1e47]: Low-complexity claims auto-approved for settlement
            - listitem [ref=f1e48]: Adjuster manages complex claims end-to-end
